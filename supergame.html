<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NB-Dungeon</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: 'Malgun Gothic', sans-serif;
        user-select: none;
    }

    canvas {
        display: block;
        margin: auto;
        image-rendering: pixelated;
        background: linear-gradient(#5da9ff, #d5f0ff);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 2px 2px 0 black;
        line-height: 1.6;
        z-index: 5;
    }

    #game-status {
        position: absolute;
        top: 15px;
        right: 15px;
        color: #ffcc00;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 0 black;
        z-index: 5;
    }

    /* 재시작 버튼 스타일 */
    #restartButton {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        padding: 15px 40px;
        cursor: pointer;
        border: none;
        background: #ff1744;
        color: white;
        box-shadow: 4px 4px 0 black;
        font-weight: bold;
        display: none;
        z-index: 20;
        transition: 0.1s;
    }
    #restartButton:hover {
        background: #ff5252;
    }
    #restartButton:active {
        transform: translate(-48%, -48%);
        box-shadow: 2px 2px 0 black;
    }
</style>
</head>
<body>

<div id="ui">
    ← → 이동 | D 점프 | A 권총 (데미지 10) | S 주먹 (데미지 5)
</div>

<div id="game-status">
    남은 몬스터: <span id="enemy-count">11</span>명 (보스 포함)
</div>

<!-- 시작 메뉴 -->
<div id="menu" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(#111,#222); z-index:10;">
    <div style="font-size:72px; color:#ffcc00; text-shadow:6px 6px 0 black; margin-bottom:10px; letter-spacing:4px; text-align:center; font-weight:bold;">
        NB-Dungeon
    </div>
    <div style="font-size:24px; color:#aaa; margin-bottom:40px; text-shadow:2px 2px 0 black;">
        용사 함현석의 뉴발 일대기!
    </div>

    <button id="startButton" style="font-size:32px; padding:20px 50px; cursor:pointer; border:none; background:#ffffff; box-shadow:6px 6px 0 #ffcc00; font-weight:bold; transition: 0.1s;">
        DUNGEON ENTER
    </button>
</div>

<!-- 게임 오버 시 나타날 재시작 버튼 -->
<button id="restartButton">RESTART GAME</button>

<canvas id="game" width="960" height="540"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.6; 
const MAP_WIDTH = 5000; 
const menu = document.getElementById('menu');
const startButton = document.getElementById('startButton');
const restartButton = document.getElementById('restartButton');
const enemyCountUI = document.getElementById('enemy-count');

let gameStarted = false;
let gameOver = false;
let gameClear = false;
const keys = {};
let cameraX = 0;

// 플레이어 설정
const player = {
    x: 100,
    y: 300,
    width: 40,
    height: 60,
    vx: 0,
    vy: 0,
    speed: 2.5,       
    jumpForce: 15.5,   
    grounded: false,
    facing: 'right',
    state: 'idle', 
    stateTimer: 0,
    
    hp: 100,
    maxHp: 100,
    invincibleTimer: 0,    
    gunCooldown: 0,        
    maxGunCooldown: 120,   
    punchCooldown: 0,      
    maxPunchCooldown: 60   
};

// 발판(플랫폼) 배치
const platforms = [
    { x: 0, y: 480, width: MAP_WIDTH, height: 60 }, 
    { x: 300, y: 360, width: 200, height: 20 },
    { x: 600, y: 260, width: 220, height: 20 },
    { x: 950, y: 340, width: 200, height: 20 },
    { x: 1300, y: 220, width: 250, height: 20 },
    { x: 1650, y: 360, width: 200, height: 20 },
    { x: 1950, y: 250, width: 300, height: 20 },
    { x: 2350, y: 320, width: 200, height: 20 },
    { x: 2650, y: 200, width: 250, height: 20 },
    { x: 3000, y: 340, width: 200, height: 20 },
    { x: 3300, y: 240, width: 300, height: 20 },
    { x: 3750, y: 360, width: 220, height: 20 },
    { x: 4100, y: 260, width: 250, height: 20 },
    { x: 4450, y: 340, width: 500, height: 20 } 
];

// 적 데이터를 담을 실시간 배열
let enemies = [];

// 투사체 및 히트박스 배열들
let bullets = [];
let punches = [];
let damageTexts = [];      
let bossProjectiles = [];  
let bossMeleeAttacks = []; 

function initEnemies() {
    enemies = [
        { id: 1, x: 400, y: 300, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.6, dir: 1, minX: 300, maxX: 500, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 2, x: 700, y: 200, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.8, dir: -1, minX: 600, maxX: 820, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 3, x: 1100, y: 420, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.5, dir: 1, minX: 900, maxX: 1250, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 4, x: 1400, y: 160, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.7, dir: 1, minX: 1300, maxX: 1550, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 5, x: 2050, y: 190, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.6, dir: -1, minX: 1950, maxX: 2250, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 6, x: 2500, y: 420, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.7, dir: 1, minX: 2300, maxX: 2800, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 7, x: 2750, y: 140, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.9, dir: 1, minX: 2650, maxX: 2900, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 8, x: 3400, y: 180, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.6, dir: -1, minX: 3300, maxX: 3600, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 9, x: 3850, y: 300, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.7, dir: 1, minX: 3750, maxX: 3970, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        { id: 10, x: 4200, y: 200, width: 40, height: 60, hp: 50, maxHp: 50, speed: 0.8, dir: -1, minX: 4100, maxX: 4350, label: "인사 안 받아주는 손님", color: "#4f5d75", hitTimer: 0 },
        // 최종 보스
        {
            isBoss: true,
            id: 999,
            x: 4600,
            y: 300,
            width: 80,       
            height: 110,
            hp: 200,
            maxHp: 200,
            speed: 0.5,      
            dir: -1,
            minX: 4450,
            maxX: 4900,
            label: "인사 안 받아주는 손님의 부모",
            hitTimer: 0,
            scratchCooldown: 0, 
            fireballCooldown: 0 
        }
    ];
    enemyCountUI.textContent = enemies.length;
}

initEnemies();

function damagePlayer(amount) {
    if (player.invincibleTimer > 0) return; 

    player.hp -= amount;
    player.invincibleTimer = 120; 
    
    // 피격시 수치가 위로 떠오르는 플로팅 텍스트
    damageTexts.push({
        x: player.x + player.width / 2,
        y: player.y - 25, // 이름 표기 영역 상단으로 띄움
        text: `- ${amount}`,
        life: 45 
    });

    if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        restartButton.style.display = 'block';
    }
}

// 키보드 입력
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (!gameStarted || gameOver || gameClear) return;

    if (e.key === 'a' || e.key === 'A') {
        if (player.state !== 'attack' && player.state !== 'punch' && player.gunCooldown === 0) {
            player.state = 'attack';
            player.stateTimer = 12;
            player.gunCooldown = player.maxGunCooldown; 
            
            bullets.push({
                x: player.facing === 'right' ? player.x + player.width : player.x - 12,
                y: player.y + player.height / 2 - 4,
                vx: player.facing === 'right' ? 12 : -12, 
                width: 12,
                height: 6,
                damage: 10 
            });
        }
    }
    
    if (e.key === 's' || e.key === 'S') {
        if (player.state !== 'attack' && player.state !== 'punch' && player.punchCooldown === 0) {
            player.state = 'punch';
            player.stateTimer = 15;
            player.punchCooldown = player.maxPunchCooldown; 
            
            punches.push({
                x: player.facing === 'right' ? player.x + player.width : player.x - 35,
                y: player.y + player.height / 3,
                width: 35,
                height: 20,
                timer: 10,
                damage: 5, 
                hitEnemies: [] 
            });
        }
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

startButton.addEventListener('click', () => {
    gameStarted = true;
    menu.style.display = 'none';
    gameLoop();
});

restartButton.addEventListener('click', () => {
    gameOver = false;
    gameClear = false;
    
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.hp = player.maxHp;
    player.invincibleTimer = 0;
    player.gunCooldown = 0;
    player.punchCooldown = 0;
    player.state = 'idle';
    player.stateTimer = 0;
    player.facing = 'right';
    player.grounded = false;

    bullets = [];
    punches = [];
    damageTexts = [];
    bossProjectiles = [];
    bossMeleeAttacks = [];
    initEnemies();

    restartButton.style.display = 'none';
});

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

function update() {
    if (gameOver || gameClear) return;

    if (player.gunCooldown > 0) player.gunCooldown--;
    if (player.punchCooldown > 0) player.punchCooldown--;
    if (player.invincibleTimer > 0) player.invincibleTimer--;

    for (let i = damageTexts.length - 1; i >= 0; i--) {
        damageTexts[i].y -= 0.8;
        damageTexts[i].life--;
        if (damageTexts[i].life <= 0) {
            damageTexts.splice(i, 1);
        }
    }

    if (keys['ArrowLeft']) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else if (keys['ArrowRight']) {
        player.vx = player.speed;
        player.facing = 'right';
    } else {
        player.vx = 0;
    }

    if ((keys['d'] || keys['D']) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
    player.grounded = false;

    if (player.x < 0) player.x = 0;
    if (player.x > MAP_WIDTH - player.width) player.x = MAP_WIDTH - player.width;

    for (let plat of platforms) {
        if (checkCollision(player, plat)) {
            if (player.vy > 0 && player.y + player.height - player.vy <= plat.y + 6) {
                player.y = plat.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
        }
    }

    if (player.stateTimer > 0) {
        player.stateTimer--;
    } else {
        player.state = 'idle';
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];

        if (enemy.hitTimer > 0) enemy.hitTimer--;

        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x <= enemy.minX) {
            enemy.x = enemy.minX;
            enemy.dir = 1;
        } else if (enemy.x >= enemy.maxX) {
            enemy.x = enemy.maxX;
            enemy.dir = -1;
        }

        enemy.y += 4;
        for (let plat of platforms) {
            if (checkCollision(enemy, plat)) {
                if (enemy.y + enemy.height - 4 <= plat.y + 6) {
                    enemy.y = plat.y - enemy.height;
                }
            }
        }

        // 보스 AI 로직
        if (enemy.isBoss) {
            if (enemy.scratchCooldown > 0) enemy.scratchCooldown--;
            if (enemy.fireballCooldown > 0) enemy.fireballCooldown--;

            if (player.x > 3800) {
                // 1. 할퀴기 패턴 (3초)
                if (enemy.scratchCooldown === 0) {
                    let distanceToPlayer = Math.abs((enemy.x + enemy.width / 2) - (player.x + player.width / 2));
                    if (distanceToPlayer < enemy.width / 2 + 35 + player.width / 2) {
                        enemy.scratchCooldown = 180; 
                        
                        let scratchX = enemy.dir === 1 ? enemy.x + enemy.width : enemy.x - 35;
                        let scratchHitbox = {
                            x: scratchX,
                            y: enemy.y + enemy.height / 3,
                            width: 35,
                            height: 30
                        };

                        bossMeleeAttacks.push({ x: scratchHitbox.x, y: scratchHitbox.y, width: scratchHitbox.width, height: scratchHitbox.height, timer: 12 });

                        if (checkCollision(scratchHitbox, player)) {
                            damagePlayer(15); 
                        }
                    }
                }

                // 2. 화염구 패턴 (8초) - 높이를 enemy.y + 65 로 낮추어 용사 캐릭터가 피격되도록 수정
                if (enemy.fireballCooldown === 0) {
                    enemy.fireballCooldown = 480; 
                    
                    let fireballX = enemy.dir === 1 ? enemy.x + enemy.width : enemy.x - 20;
                    bossProjectiles.push({
                        x: fireballX,
                        y: enemy.y + 65, // 기존 25에서 65로 낮춤 (플레이어 중앙 높이 피격 타겟팅)
                        vx: enemy.dir * 4.5,
                        width: 18,
                        height: 18,
                        startX: fireballX,
                        damage: 20
                    });
                }
            }
        }

        if (checkCollision(player, enemy)) {
            damagePlayer(10);
        }

        if (enemy.hp <= 0) {
            enemies.splice(i, 1);
            enemyCountUI.textContent = enemies.length;
            if (enemies.length === 0) gameClear = true;
            continue;
        }
    }

    for (let i = bossMeleeAttacks.length - 1; i >= 0; i--) {
        bossMeleeAttacks[i].timer--;
        if (bossMeleeAttacks[i].timer <= 0) bossMeleeAttacks.splice(i, 1);
    }

    for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        let fp = bossProjectiles[i];
        fp.x += fp.vx;

        if (checkCollision(fp, player)) {
            damagePlayer(fp.damage);
            bossProjectiles.splice(i, 1);
            continue;
        }

        // 주먹 사거리의 3배(105px)의 사거리 이동 기준 제한
        if (Math.abs(fp.x - fp.startX) >= 315) { 
            bossProjectiles.splice(i, 1);
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        let bulletRemoved = false;

        for (let enemy of enemies) {
            if (checkCollision(b, enemy)) {
                enemy.hp -= b.damage;
                enemy.hitTimer = 8;
                bullets.splice(i, 1);
                bulletRemoved = true;
                break;
            }
        }
        if (bulletRemoved) continue;

        if (Math.abs(b.x - player.x) > 1000) bullets.splice(i, 1);
    }

    for (let i = punches.length - 1; i >= 0; i--) {
        let p = punches[i];
        p.timer--;

        for (let enemy of enemies) {
            if (checkCollision(p, enemy)) {
                if (!p.hitEnemies.includes(enemy.id)) {
                    enemy.hp -= p.damage;
                    enemy.hitTimer = 8;
                    p.hitEnemies.push(enemy.id);
                }
            }
        }
        if (p.timer <= 0) punches.splice(i, 1);
    }

    cameraX = player.x - canvas.width / 3;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > MAP_WIDTH - canvas.width) cameraX = MAP_WIDTH - canvas.width;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 1. 발판
    for (let plat of platforms) {
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(plat.x, plat.y, plat.width, 6);
    }

    // 2. 무기 및 보스 패턴 투사체 이펙트
    ctx.fillStyle = '#ffeb3b'; 
    for (let b of bullets) {
        ctx.fillRect(b.x, b.y, b.width, b.height);
    }
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)'; 
    for (let p of punches) {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    }
    ctx.fillStyle = 'rgba(255, 23, 68, 0.6)';
    for (let ma of bossMeleeAttacks) {
        ctx.fillRect(ma.x, ma.y, ma.width, ma.height);
    }
    for (let fp of bossProjectiles) {
        ctx.fillStyle = '#ff5722';
        ctx.fillRect(fp.x, fp.y, fp.width, fp.height);
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(fp.x + 3, fp.y + 3, fp.width - 6, fp.height - 6);
    }

    // 3. 적 및 보스 캐릭터 모델링
    let isBossAlive = false;
    let currentBossHP = 0;
    let currentBossMaxHP = 200;

    for (let enemy of enemies) {
        if (enemy.isBoss) {
            isBossAlive = true;
            currentBossHP = enemy.hp;

            ctx.save();
            let mainColor = enemy.hitTimer > 0 ? '#ff1744' : '#111111';

            ctx.fillStyle = '#b71c1c'; 
            if (enemy.dir === 1) { 
                ctx.fillRect(enemy.x - 20, enemy.y + 20, 25, 40); 
                ctx.fillRect(enemy.x - 10, enemy.y + 10, 20, 20);
            } else { 
                ctx.fillRect(enemy.x + enemy.width - 5, enemy.y + 20, 25, 40); 
                ctx.fillRect(enemy.x + enemy.width - 10, enemy.y + 10, 20, 20);
            }

            ctx.fillStyle = mainColor;
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

            ctx.fillStyle = '#d50000';
            ctx.fillRect(enemy.x + 15, enemy.y - 15, 12, 15); 
            ctx.fillRect(enemy.x + enemy.width - 27, enemy.y - 15, 12, 15); 

            ctx.fillStyle = '#ff1744';
            let bEyeX = enemy.dir === 1 ? enemy.x + enemy.width - 25 : enemy.x + 13;
            ctx.fillRect(bEyeX, enemy.y + 25, 12, 12); 
            ctx.restore();

        } else {
            ctx.fillStyle = enemy.hitTimer > 0 ? '#ff1744' : enemy.color;
            ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

            ctx.fillStyle = '#000';
            let eEyeX = enemy.dir === 1 ? enemy.x + enemy.width - 12 : enemy.x + 4;
            ctx.fillRect(eEyeX, enemy.y + 12, 8, 8);
        }

        ctx.fillStyle = enemy.isBoss ? '#ff1744' : 'white'; 
        ctx.font = enemy.isBoss ? 'bold 15px sans-serif' : 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = enemy.isBoss ? 4 : 3;
        ctx.strokeText(enemy.label, enemy.x + enemy.width / 2, enemy.y - (enemy.isBoss ? 24 : 14));
        ctx.fillText(enemy.label, enemy.x + enemy.width / 2, enemy.y - (enemy.isBoss ? 24 : 14));

        if (!enemy.isBoss) {
            const barWidth = 60;
            const barHeight = 6;
            const barX = enemy.x + (enemy.width - barWidth) / 2;
            const barY = enemy.y - 10;
            ctx.fillStyle = '#d32f2f';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(barX, barY, barWidth * (enemy.hp / enemy.maxHp), barHeight);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(barX, barY, barWidth, barHeight);
        }
    }

    // 4. 플레이어 캐릭터 그리기
    let drawPlayer = true;
    if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 4) % 2 === 0) {
        drawPlayer = false;
    }

    if (drawPlayer) {
        ctx.fillStyle = '#e91e63';
        ctx.fillRect(player.x, player.y, player.width, player.height);

        ctx.fillStyle = '#000000';
        let eyeX = player.facing === 'right' ? player.x + player.width - 12 : player.x + 4;
        ctx.fillRect(eyeX, player.y + 12, 8, 8);

        if (player.state === 'attack') {
            ctx.fillStyle = '#795548';
            let gunX = player.facing === 'right' ? player.x + player.width : player.x - 16;
            ctx.fillRect(gunX, player.y + player.height / 2 - 4, 16, 8);
        } else if (player.state === 'punch') {
            ctx.fillStyle = '#ff9800';
            let handX = player.facing === 'right' ? player.x + player.width : player.x - 12;
            ctx.fillRect(handX, player.y + player.height / 3, 12, 12);
        }
    }

    // [요청 사항]: 캐릭터 상단 상시 표기 네임 텍스트 '용사 함현석'
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3.5;
    ctx.strokeText('용사 함현석', player.x + player.width / 2, player.y - 12);
    ctx.fillText('용사 함현석', player.x + player.width / 2, player.y - 12);
    ctx.restore();

    // 5. 피격 데미지 플로팅 텍스트 그리기
    for (let dt of damageTexts) {
        ctx.save();
        ctx.fillStyle = '#ff1744'; 
        ctx.font = 'bold 16px sans-serif'; 
        ctx.textAlign = 'center';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 4;
        ctx.fillText(dt.text, dt.x, dt.y);
        ctx.restore();
    }

    ctx.restore();

    // 6. 하단 플레이어 인터페이스 (HUD)
    drawInterface();

    // 7. 보스 체력바
    if (isBossAlive && player.x > 3800) { 
        drawBossBar(currentBossHP, currentBossMaxHP);
    }

    if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 64px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
    } else if (gameClear) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 64px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('DUNGEON CLEAR!', canvas.width / 2, canvas.height / 2);
        ctx.font = '24px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('용사 함현석이 NB-Dungeon의 무법자 가문을 완벽히 토벌했습니다.', canvas.width / 2, canvas.height / 2 + 60);
    }
}

function drawBossBar(hp, maxHp) {
    const barW = 600;
    const barH = 20;
    const barX = (canvas.width - barW) / 2;
    const barY = 60;

    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;
    ctx.strokeText("⚠️ BOSS : 인사 안 받아주는 손님의 부모 ⚠️", canvas.width / 2, barY - 10);
    ctx.fillText("⚠️ BOSS : 인사 안 받아주는 손님의 부모 ⚠️", canvas.width / 2, barY - 10);

    ctx.fillStyle = '#420000';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(barX, barY, barW * (hp / maxHp), barH);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText(`HP ${hp} / ${maxHp}`, canvas.width / 2, barY + 14);
}

function drawInterface() {
    const hudY = canvas.height - 50;
    
    ctx.fillStyle = 'rgba(20, 20, 20, 0.85)';
    ctx.fillRect(0, hudY, canvas.width, 50);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, hudY);
    ctx.lineTo(canvas.width, hudY);
    ctx.stroke();

    ctx.fillStyle = 'white';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`HP ${player.hp} / ${player.maxHp}`, 20, hudY + 18);

    const hpBarWidth = 250;
    const hpBarHeight = 16;
    ctx.fillStyle = '#551a1a'; 
    ctx.fillRect(20, hudY + 24, hpBarWidth, hpBarHeight);
    ctx.fillStyle = '#ff1744'; 
    ctx.fillRect(20, hudY + 24, hpBarWidth * (player.hp / player.maxHp), hpBarHeight);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(20, hudY + 24, hpBarWidth, hpBarHeight);

    const skillStartX = 310;
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px sans-serif';

    ctx.fillStyle = '#ffeb3b';
    ctx.fillText("A 권총 쿨타임 :", skillStartX, hudY + 33);
    ctx.fillStyle = '#333';
    ctx.fillRect(skillStartX + 90, hudY + 22, 120, 14);
    if (player.gunCooldown === 0) {
        ctx.fillStyle = '#4caf50'; 
        ctx.fillRect(skillStartX + 90, hudY + 22, 120, 14);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText("READY", skillStartX + 135, hudY + 33);
    } else {
        ctx.fillStyle = '#f57f17'; 
        const progress = 1 - (player.gunCooldown / player.maxGunCooldown);
        ctx.fillRect(skillStartX + 90, hudY + 22, 120 * progress, 14);
        ctx.fillStyle = 'white';
        ctx.font = '10px sans-serif';
        ctx.fillText(`${(player.gunCooldown / 60).toFixed(1)}s`, skillStartX + 138, hudY + 33);
    }
    ctx.strokeStyle = '#555';
    ctx.strokeRect(skillStartX + 90, hudY + 22, 120, 14);

    ctx.fillStyle = '#ff9800';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText("S 주먹 쿨타임 :", skillStartX + 240, hudY + 33);
    ctx.fillStyle = '#333';
    ctx.fillRect(skillStartX + 330, hudY + 22, 120, 14);
    if (player.punchCooldown === 0) {
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(skillStartX + 330, hudY + 22, 120, 14);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText("READY", skillStartX + 375, hudY + 33);
    } else {
        ctx.fillStyle = '#e65100';
        const progress = 1 - (player.punchCooldown / player.maxPunchCooldown);
        ctx.fillRect(skillStartX + 330, hudY + 22, 120 * progress, 14);
        ctx.fillStyle = 'white';
        ctx.font = '10px sans-serif';
        ctx.fillText(`${(player.punchCooldown / 60).toFixed(1)}s`, skillStartX + 378, hudY + 33);
    }
    ctx.strokeStyle = '#555';
    ctx.strokeRect(skillStartX + 330, hudY + 22, 120, 14);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
